<aside class="sidebar-shell">
    <div class="brand-block">
        <div class="brand-badge">V2</div>
        <div>
            <div class="brand-title">easyONBOARDING</div>
            <div class="brand-subtitle">Admin & Lifecycle Platform</div>
        </div>
    </div>

    <nav class="nav flex-column gap-2 mt-4">
        {% for item in nav_items %}
        <a class="nav-link sidebar-link {% if item.is_active %}active{% endif %}" href="{{ item.path }}">
            <i class="bi {{ item.icon }}"></i>
            <span>{{ item.title }}</span>
        </a>
        {% endfor %}
    </nav>

    <div class="sidebar-footer mt-auto">
        <div class="small text-uppercase text-secondary mb-2">Status</div>
        <div class="status-card">
            <strong>Foundation Build</strong>
            <span>GUI-Grundgerüst aktiv</span>
        </div>
    </div>
</aside>
