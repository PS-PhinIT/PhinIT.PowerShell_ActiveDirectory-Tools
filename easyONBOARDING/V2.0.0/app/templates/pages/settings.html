{% extends 'base.html' %}

{% block content %}
<div class="row g-4">
    {% for group in setting_groups %}
    <div class="col-12 col-lg-4">
        <section class="content-card h-100">
            <h3>{{ group.title }}</h3>
            <p class="text-secondary mb-0 mt-3">{{ group.detail }}</p>
        </section>
    </div>
    {% endfor %}
</div>

{% include 'partials/context_help_links.html' %}
{% endblock %}
