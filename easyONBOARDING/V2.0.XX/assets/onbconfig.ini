; =====================================================================
; Konfigurationsdatei für das easyONBOARDING Skript
; =====================================================================
; Diese Datei enthält alle notwendigen Einstellungen für den
; automatisierten Onboarding-Prozess neuer Mitarbeiter.
;
; Erstellt von: GitHub Copilot
; Datum: 16.07.2025
; Version: 2.0
; =====================================================================

[General]
; Allgemeine Einstellungen
CompanyName=Ihre Firma GmbH
DomainName=ihredomain.local
DomainMail=ihredomain.com
DebugMode=true
; Log-Level: 0=Fehler, 1=Warnung, 2=Info, 3=Debug
LogLevel=2
; Log-Datei: Pfad zur Log-Datei, in der die Ausgaben des Skripts gespeichert werden.
LogPath=C:\Logs\easyONBOARDING\
DefaultOU=OU=Benutzer,OU=Standort,DC=ihredomain,DC=local

[Templates]
; Pfade zu verschiedenen HTML-Vorlagen, die auch zur PDF-Generierung genutzt werden können.
WelcomeEmailUser=.\assets\templates\WelcomeEmail_User.html
Signature=.\assets\templates\Signature.html
; Vorlage für das PDF mit den initialen Zugangsdaten (kann eine HTML-Datei sein, die konvertiert wird).
InitialCredentialsPDF=.\assets\templates\InitialCredentials_Template.html
NotifyManagerEmail=.\assets\templates\NotifyManager_Template.html
NotifyHelpdeskEmail=.\assets\templates\NotifyHelpdesk_Template.html
OffboardingInfoEmail=.\assets\templates\OffboardingInfo_Template.html

[UserCreation]
; --- Allgemeine Passwort-Einstellungen ---
; DefaultPassword: Standardpasswort, das für neue Benutzer verwendet wird.
DefaultPassword=Willkommen2025!
; ChangePasswordAtNextLogon: Soll der Benutzer beim ersten Anmelden das Passwort ändern müssen?
ChangePasswordAtNextLogon=true

; --- Allgemeine UserPrincipal Name (UPN) Einstellungen ---
; UPN-Format: Legt fest, wie der Benutzerteil des UPNs gebildet wird.
; Format 1: $firstname.$lastname (z.B. max.mustermann)
; Format 2: $initials.$lastname (z.B. m.mustermann)
; Format 3: $lastname$initials (z.B. mustermannm)
; Format 4: $samaccountname (verwendet die Einstellung aus NamingConvention)
; Format 5: $firstname_$lastname (z.B. max_mustermann)
; Format 6: $firstname-$lastname (z.B. max-mustermann)
; Format 7: $firstname$lastname (z.B. maxmustermann)
; Format 8: $lastname.$firstname (z.B. mustermann.max)
; Format 9: $initials_$lastname (z.B. m_mustermann)
; Format 10: $lastname-$initials (z.B. mustermann-m)
; SAMFormat: Legt fest, wie der SAMAccountName gebildet wird.
SAMFormat=1
; UPNFormat: Legt fest, wie der UPN gebildet wird.
UPNFormat=1
; UPN Suffix, z.B. "ihrefirma.com". Wenn leer, wird DomainName verwendet.
UPNSuffix=


; --- Allgemeine E-Mail-Einstellungen ---
; Format 1: $firstname.$lastname@$DomainMail (z.B. max.mustermann@firma.com)
; Format 2: $initials.$lastname@$DomainMail (z.B. m.mustermann@firma.com)
; Format 3: $lastname$initials@$DomainMail (z.B. mustermannm@firma.com)
; Format 4: $samaccountname@$DomainMail (z.B. max.mustermann@firma.com)
; Format 5: $firstname_$lastname@$DomainMail (z.B. max_mustermann@firma.com)
; Format 6: $firstname-$lastname@$DomainMail (z.B. max-mustermann@firma.com)
; Format 7: $firstname$lastname@$DomainMail (z.B. maxmustermann@firma.com)
; Format 8: $lastname.$firstname@$DomainMail (z.B. mustermann.max@firma.com)
; Format 9: $initials_$lastname@$DomainMail (z.B. m_mustermann@firma.com)
; Format 10: $lastname-$initials@$DomainMail (z.B. mustermann-m@firma.com)
MailAddressFormat=1
; --- Zusätzliche E-Mail-Adressen ---
; EnableSecondaryAddresses: Aktiviert die Erstellung zusätzlicher SMTP-Adressen.
EnableSecondaryAddresses=true
; Format für zusätzliche smtp-Adressen (1-10, entsprechend MailAddressFormat)
; Leer lassen oder 0 setzen, wenn keine sekundäre Adresse gewünscht
SecondaryFormat1=2
SecondaryFormat2=5
SecondaryFormat3=8

ProfilePath=\\server\profiles\%username%
HomeDirectory=\\server\home\%username%
HomeDrive=H:
LogonScript=logon.bat

[PasswordPolicy]
; Richtlinie für die Generierung von Standardpasswörtern
; Wenn UsePolicy=true, wird das DefaultPassword ignoriert und ein zufälliges Passwort generiert.
UsePolicy=true
PasswordLength=14
IncludeUppercase=true
IncludeLowercase=true
IncludeNumbers=true
IncludeSpecialChars=true
SpecialChars=!@#$%^&*()

[Exchange]
; Einstellungen für Exchange (On-Premise, Online, Hybrid)
; Environment: Legt die E-Mail-Umgebung fest.
;   - Online: Reines Exchange Online (Microsoft 365).
;   - OnPremise: Nur lokaler Exchange Server.
;   - Hybrid: Lokaler AD mit Synchronisierung zu Microsoft 365.
ExchangeEnvironment=Hybrid

; --- Exchange On-Premise / Hybrid ---
; Gilt, wenn Environment = "OnPremise" oder "Hybrid"
EnableOnPremMailbox=true
; Bei Hybrid: Soll eine Remote-Mailbox erstellt werden? Überschreibt EnableOnPremMailbox.
EnableRemoteMailbox=true
ExchangeServer=exchange01.ihredomain.local
MailboxDatabase=Mailbox-Datenbank-01
; OU, in der das Postfach erstellt wird (falls abweichend von DefaultOU)
MailboxOU=

; --- Exchange Online ---
; Gilt, wenn Environment = "Online" oder "Hybrid"
EnableOnlineMailbox=true
EnableArchiving=false
LitigationHoldEnabled=false
LitigationHoldDurationDays=3650 ; 10 Jahre

; --- AD Sync (Entra ID Connect) ---
; Gilt, wenn Environment = "Hybrid"
; Gruppe, in welcher die Benutzer für die Synchronisierung mit Microsoft 365 liegen.
SyncGroup=MS365_ADSync_Users
; Server und Anmeldeinformationen für die manuelle Auslösung der Synchronisierung.
SyncServer=adsync01.ihredomain.local
SyncServiceAccount=ihredomain\ADSyncService
; Hinweis: Passwort sollte sicher gespeichert werden, z.B. als verschlüsselter String oder in einem Credential Manager.
SyncServicePassword=


[Microsoft365]
; Einstellungen für Microsoft 365 / Entra ID
; TenantID=IHRTENANT.onmicrosoft.com

; --- Benutzer & Lizenzierung ---
AssignLicense=true
; LicenseSKU: Die genaue SKU für die zuzuordnende Lizenz (z.B. "CONTOSO:SPE_E3")
LicenseSKU=
; DisabledServicePlans: Komma-getrennte Liste von Diensten innerhalb der SKU, die deaktiviert werden sollen (z.B. "SWAY,YAMMER_ENTERPRISE")
DisabledServicePlans=

; SharePoint Online
; Komma-getrennte Liste von Standard-SharePoint-Grupen, auf die die Benutzer Zugriff erhalten sollen
DefaultSharePointGroups=SPO-SITE-PUBLIC

; Microsoft Teams
; Komma-getrennte Liste von Standard-Teams, denen der Benutzer beitreten soll
DefaultTeams=AllCompanyTeam
EnableTeamsCalling=false

[Groups]
; Standard-AD-Gruppen, denen neue Benutzer hinzugefügt werden
DefaultGroups=PhinIT-USER

[Departments]
; Abteilungsspezifische Konfigurationen
; Jede Sektion [Department_...] kann Standardeinstellungen überschreiben
; und spezifische Gruppen oder Lizenzen hinzufügen.

[Department_IT]
OrganisationsUnit=OU=Mitarbeiter,OU=USER,OU=TestCompany,DC=phinit,DC=de
Groups=TEAM-1, TEAM-2, GRP_IT
LicenseSKU=IHRTENANT:SPE_E5
Software=7-Zip, Notepad++, Visual Studio Code
SharePointGroups=SPO-SITE-IT, SPO-SITE-IT-Projects
Teams=IT Department,IT Projects

[Department_Sales]
OrganisationsUnit=OU=Mitarbeiter,OU=USER,OU=TestCompany,DC=phinit,DC=de
Groups=TEAM-6, TEAM-9, DEPT_Sales
LicenseSKU=IHRTENANT:SPE_E3
Software=CRM-Client, Office-Paket
SharePointGroups=SPO-SITE-Sales, SPO-SITE-Sales-Projects
Teams=Sales Team

[Department_Marketing]
OrganisationsUnit=OU=Mitarbeiter,OU=USER,OU=TestCompany,DC=phinit,DC=de
Groups=TEAM-4, TEAM-7, GRP_Marketing
LicenseSKU=IHRTENANT:ADOBE_CC_PREMIUM
Software=Adobe Photoshop, Adobe InDesign
SharePointGroups=SPO-SITE-Marketing, SPO-SITE-Marketing-Projects
Teams=Marketing Team

[CustomAttributes]
; Setzen von benutzerdefinierten Active Directory Attributen
; Format: AttributName=Wert. %username%, %firstname%, %lastname% etc. können als Platzhalter verwendet werden.
extensionAttribute1=Mitarbeiter-ID-%random%
extensionAttribute2=Kostenstelle-%department%

[GuiSettings]
; Standardwerte für Checkboxen in der GUI
DefaultTerminalAccess=false
DefaultVPNAccess=true
DefaultMS365Sync=true
DefaultJiraAccess=false

[AccessGroupMapping]
; Weist den GUI-Optionen die entsprechenden AD-Gruppennamen zu.
; Diese werden zugewiesen, wenn die jeweilige Checkbox in der GUI aktiviert ist.
TerminalServerGroup=GRP_Terminalserver_Access
VPNAccessGroup=GRP_VPN_Users
MS365SyncGroup=GRP_AzureAD_Sync
JiraAccessGroup=GRP_Jira_Users
ConfluenceAccessGroup=GRP_Confluence_Users

[ApplicationRoles]
; Definition von Rollen in spezifischen Anwendungen (z.B. Jira, Confluence)
; Diese können abteilungsspezifisch oder individuell zugewiesen werden.
JiraDefaultRole=jira-software-users
ConfluenceDefaultRole=confluence-users

[Telephony]
; Einstellungen für die Telefonanlage (z.B. STARFACE, Swyx, 3CX)
CreateExtension=true
ExtensionPrefix=498912345
ExtensionRangeStart=100
ExtensionRangeEnd=999
DefaultVoicemailPin=1234

[Software]
; Softwareverteilung via SCCM, Intune oder anderen Tools
DefaultSoftware=Microsoft Office, Adobe Reader, Browser-Choice

[Hardware]
; Standard-Hardware-Zuweisung
DefaultLaptopModel=Laptop Modell XYZ
DefaultPhoneModel=Smartphone Modell ABC

[Notifications]
; Benachrichtigungseinstellungen nach Abschluss des Onboardings
NotifyManager=true
NotifyITHelpdesk=true
SMTPServer=smtp.ihredomain.com
SMTPPort=587
SMTPFrom=it-noreply@ihredomain.com
SMTPTo=it-helpdesk@ihredomain.com
SMTPUseSSL=true

; =====================================================================
; Ende der Konfigurationsdatei
; =====================================================================
