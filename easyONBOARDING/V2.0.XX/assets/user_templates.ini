# =============================================================================
# Benutzervorlagen für easyONBOARDING
# =============================================================================
# Diese Datei enthält vordefinierte Benutzervorlagen für verschiedene Rollen
# und Abteilungen, die den Onboarding-Prozess vereinfachen.
# =============================================================================

# =============================================================================
# GLOBALE KONFIGURATIONSÜBERSCHREIBUNGEN
# Diese Sektion überschreibt globale Konfigurationswerte aus onbconfig.ini
# =============================================================================
[GlobalOverrides]
# Allgemeine Einstellungen
CompanyName=Template Override Company GmbH
DomainName=template.local
DomainMail=template.com
DefaultOU=OU=Template Users,DC=template,DC=local

# Benutzeranlage-Einstellungen
DefaultPassword=TemplateWelcome2025!
ChangePasswordAtNextLogon=true
UPNSuffix=template.local

# Gruppen-Einstellungen
DefaultGroups=TEMPLATE-USER,TEMPLATE-GENERAL

# Exchange-Einstellungen
ExchangeEnvironment=Hybrid
EmailAddressPolicy=SMTP:%firstname%.%lastname%@template.com
EnableOnPremMailbox=true
EnableRemoteMailbox=true

# M365-Einstellungen
M365AssignLicense=true
M365LicenseSKU=SPE_E3

# GUI-Standardeinstellungen
DefaultTerminalAccess=false
DefaultVPNAccess=true
DefaultMS365Sync=true
DefaultJiraAccess=false

# Telefonie-Einstellungen
StarfaceEnabled=true
TelephonyExtensionPrefix=49891234

# Benachrichtigungs-Einstellungen
NotifyManager=true
NotifyITHelpdesk=true
SMTPServer=smtp.template.com
SMTPPort=587
SMTPFrom=it-noreply@template.com
SMTPTo=it-helpdesk@template.com

# =============================================================================
# BENUTZERVORLAGEN
# =============================================================================

# Standard-Vorlage für alle Benutzer
[Template_Standard]
Name=Standard Benutzer
Description=Grundlegende Benutzer-Vorlage mit Standardberechtigungen
DefaultGroups=GRP_Domain_Users,GRP_BasicAccess
DefaultOU=CN=Users,DC=domain,DC=local
DefaultPassword=Willkommen2025!
ChangePasswordAtNextLogon=true
PasswordNeverExpires=false
AccountDisabled=false
CreateHomeDirectory=true
CreateProfile=true
EnableExchange=true
EnableM365=true
M365LicenseSKU=STANDARDPACK
TerminalAccess=false
VPNAccess=true
JiraAccess=false
DefaultSoftware=Microsoft Office 365,Web Browser,PDF Reader
PhoneExtension=false
VoicemailEnabled=false

